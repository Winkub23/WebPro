<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>เข้าสู่ระบบ / สมัครสมาชิก - RecipeHub</title>
    <h:outputStylesheet name="css/App.css" />
</h:head>
<h:body>
    <div class="app-layout" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
        <div class="modal-content auth-modal" style="position: static; transform: none; width: 100%; max-width: 420px;">
            <div class="modal-header">
                <h3>เข้าสู่ระบบ / สมัครสมาชิก</h3>
            </div>

            <h:panelGroup rendered="#{not empty authBean.errorMsg}">
                <div class="auth-error">#{authBean.errorMsg}</div>
            </h:panelGroup>

            <h:form styleClass="recipe-form">
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน / Username *</label>
                    <h:inputText value="#{authBean.username}" styleClass="search-input" />
                </div>

                <div class="form-group">
                    <label>อีเมล / Email (สำหรับสมัครสมาชิก)</label>
                    <h:inputText value="#{authBean.email}" styleClass="search-input" />
                </div>

                <div class="form-group">
                    <label>รหัสผ่าน / Password *</label>
                    <h:inputSecret value="#{authBean.password}" styleClass="search-input" />
                </div>

                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <h:commandButton value="เข้าสู่ระบบ" action="#{authBean.login}" styleClass="btn-primary" style="flex: 1;" />
                    <h:commandButton value="สมัครสมาชิก" action="#{authBean.register}" styleClass="btn-secondary" style="flex: 1;" />
                </div>
            </h:form>

            <div style="margin-top: 20px; text-align: center;">
                <h:outputLink value="index.xhtml" style="color: var(--accent-gold);">← กลับหน้าหลัก</h:outputLink>
            </div>
        </div>
    </div>
</h:body>
</html>
